# Sweep for stabilized gradient methods on DVS datasets
# Tests stable_cgrad, adaptive_cgrad, and conservative_cgrad

method: bayes
program: train.py
metric:
  goal: maximize
  name: val/max
name: event_stable_cgrad_sweep
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--log-wandb"
  - ${args}

parameters:
  # Fixed parameters
  data-path:
    value: /data/rboone/datasets/wg_dvst
  dataset:
    value: cifar10dvs
  dS-du:
    value: Gamma
  experiment:
    value: "event_stable_sweep"
  model:
    value: "max_former"
  config:
    value: ./event_sweepcfile.yaml
  epochs:
    value: 96
  
  # Sweep over the three stabilized gradient methods
  du-du:
    values:
      - stable_cgrad
      - adaptive_cgrad
      - conservative_cgrad
  
  # Common hyperparameters (optimizer)
  lr:
    distribution: log_uniform_values
    min: 1e-4
    max: 5e-3
  weight-decay:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-1
  
  # Shared gradient method hyperparameters
  snnbp-alpha:
    distribution: log_uniform_values
    min: 0.5
    max: 5.0
  snnbp-beta:
    distribution: log_uniform_values
    min: 0.5
    max: 5.0
  snnbp-epsilon:
    distribution: uniform
    min: 0.1
    max: 0.5
  
  # stable_cgrad specific: max ratio
  snnbp-max-ratio:
    distribution: uniform
    min: 1.5
    max: 5.0
  
  # adaptive_cgrad specific: decay rate
  snnbp-decay:
    distribution: uniform
    min: 0.1
    max: 1.0
  
  # conservative_cgrad specific: intervention threshold
  snnbp-intervention:
    distribution: uniform
    min: 0.5
    max: 0.95
  
  # Smoothness parameter for directionality
  snnbp-k-dir:
    distribution: uniform
    min: 0.5
    max: 3.0

early_terminate:
  type: hyperband
  min_iter: 15
  eta: 3
