# Refined sweep config - No early termination, optimized for final accuracy
# Based on best results: Config1 (alpha=2.0, beta=3.6) and Config2 (alpha=1.3, beta=1.3)
# Now includes surrogate gradient (dS/du) sweep

command:
- ${env}
- ${interpreter}
- ${program}
- --log-wandb
- --early-stop-patience=-1
- ${args}

# NO early_terminate - runs full duration for accurate final accuracy

method: bayes
metric:
  goal: maximize
  name: val/max
name: event_refined_sweep

parameters:
  config:
    value: ./event_sweepcfile.yaml
  
  # Sweep surrogate gradient types
  dS-du:
    values:
    - Gamma
    - sigmoid
  
  # Surrogate alpha for sigmoid (ignored when using Gamma)
  # SpikingJelly default is 4.0, sweep around common values
  surrogate-alpha:
    distribution: log_uniform_values
    max: 10.0
    min: 1.0

  data-path:
    value: /data/rboone/datasets/wg_dvst
  dataset:
    value: cifar10dvs
  
  # Focus on conservative_cgrad since both best configs used it
  du-du:
    value: conservative_cgrad
  
  epochs:
    value: 96
  experiment:
    value: event_refined_sweep
  
  # Narrowed around best values: 0.00314 and 0.00316
  lr:
    distribution: log_uniform_values
    max: 0.005
    min: 0.002

  model:
    value: max_former
  
  # Best values: 2.0 and 1.3 - explore 1.0 to 3.0
  snnbp-alpha:
    distribution: log_uniform_values
    max: 3.0
    min: 1.0
  
  # Best values: 3.6 and 1.3 - keep wide range
  snnbp-beta:
    distribution: log_uniform_values
    max: 5.0
    min: 1.0
  
  # Best values: 0.42 and 0.39 - narrow range
  snnbp-decay:
    distribution: uniform
    max: 0.6
    min: 0.3
  
  # Best values: 0.29 and 0.13 - narrow range
  snnbp-epsilon:
    distribution: uniform
    max: 0.35
    min: 0.1
  
  # Best values: 0.61 and 0.53 - narrow range
  snnbp-intervention:
    distribution: uniform
    max: 0.75
    min: 0.45
  
  # Best values: 0.75 and 2.91 - keep full range, important differentiator
  snnbp-k-dir:
    distribution: uniform
    max: 3.5
    min: 0.5
  
  
  # Best values: 0.02 and 0.0025 - keep wide log range
  weight-decay:
    distribution: log_uniform_values
    max: 0.03
    min: 0.001

program: train.py
