program: train.py
method: bayes
metric:
  goal: maximize
  name: val/max
name: cifar10_conservative_refine
parameters:
  # Fixed Configuration
  config:
    value: ./cifar10_sweepcfile.yaml
  experiment:
    value: cifar10_refine_conservative
  data-path:
    value: /data/rboone/datasets/cifar10/
  model:
    value: max_former
  epochs:
    value: 100
  
  # Gradient Method (Fixed to best performer)
  du-du:
    value: conservative_cgrad

  # Surrogate Function Swap
  dS-du:
    values:
      - Gamma
      - sigmoid
  
  # Surrogate Hyperparameters (Trained as necessary)
  surrogate-alpha:
    distribution: uniform
    min: 2.0
    max: 7.0
    # Used when dS-du is sigmoid
  gama:
    distribution: uniform
    min: 0.5
    max: 1.5
    # Used when dS-du is Gamma

  # Learning Hyperparameters (Refined Range)
  lr:
    distribution: uniform
    min: 0.003
    max: 0.005
  weight-decay:
    distribution: uniform
    min: 0.03
    max: 0.07

  # Conservative Gradient Hyperparameters (Refined Range)
  # Centered around your best runs (alpha~1.1-1.2, beta~1.1-1.4, eps~0.35)
  snnbp-alpha:
    distribution: uniform
    min: 1.1
    max: 1.3
  snnbp-beta:
    distribution: uniform
    min: 1.1
    max: 1.4
  snnbp-epsilon:
    distribution: uniform
    min: 0.33
    max: 0.37
  snnbp-intervention:
    distribution: uniform
    min: 0.5
    max: 0.6
    
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --log-wandb
  - ${args}