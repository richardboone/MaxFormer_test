# Sweep for stabilized gradient methods on DVS datasets
# Tests stable_cgrad, adaptive_cgrad, and conservative_cgrad

method: bayes
program: train.py
metric:
  goal: maximize
  name: val/max
name: conservative_ablate_sweep
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--log-wandb"
  - ${args}

parameters:
  # Fixed parameters
  data-path:
    value: /data/rboone/datasets/wg_dvst
  dataset:
    value: cifar10dvs
  dS-du:
    value: Gamma
  experiment:
    value: "conservative_ablate_sweep"
  model:
    value: "max_former"
  config:
    value: ./event_sweepcfile.yaml
  epochs:
    value: 96
  
  # Sweep over the three stabilized gradient methods
  du-du:
    value: conservative_ablate
  
  # Common hyperparameters (optimizer)
  lr:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-2
  weight-decay:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-1
  
  # Shared gradient method hyperparameters
  snnbp-alpha:
    distribution: log_uniform_values
    min: 0.5
    max: 5.0
  snnbp-beta:
    distribution: log_uniform_values
    min: 0.5
    max: 5.0
  snnbp-epsilon:
    distribution: uniform
    min: 0.1
    max: 1.5

  
  # conservative_cgrad specific: intervention threshold
  snnbp-intervention:
    distribution: uniform
    min: 0
    max: 0.95
  
  ablation-gmisalign:
    values:
      - true
      - false
  
  detach-reset:
    values:
      - true
      - false
