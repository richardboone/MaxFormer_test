# --- C-Grad, scale-invariant variant ---------------------------------------
# Same three-gate structure as conservative_cgrad, but the gates are
# dimensionless, so behaviour does not depend on the AMP loss scale, the batch
# size, or which layer the neuron sits in. See cgrad_analysis/README.md.
du_du: invariant_cgrad
dS_du: Gamma
use_custom_neuron: true
detach_reset: true
snnbp_tau: 0.5

snnbp_alpha: 2.0        # alpha_m  -- harmfulness gate steepness
snnbp_beta: 2.0         # alpha_d  -- threshold-proximity gate steepness
snnbp_alpha_cons: 2.0   # alpha_c  -- consistency gate steepness
snnbp_kappa: 1.0        # harmfulness margin, in units of the per-layer RMS of m
snnbp_epsilon: 0.3      # near-threshold radius, in units of V_th
snnbp_h: 0.5            # intervention threshold on the geometric-mean signal
snnbp_eta: 0.5          # correction strength (Algorithm 1 line 12)
snnbp_gamma: 5.0        # blend sharpness around h
snnbp_two_sided: true   # gate on |m|; set false for Sec. 6.1 as literally written

# NOTE: snnbp_intervention is NOT used by this mode. It defaults to 0.8, which
# would drive the intervention rate to 0.00% and silently reduce training to
# standard BPTT. This mode reads snnbp_h instead.
